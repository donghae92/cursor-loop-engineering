name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and pytest
        run: |
          pip install -e ".[dev]"
          pip install pytest

      - name: Bootstrap framework runtime
        run: PYTHONPATH=sdk:runtime python3 -m cursor_loop bootstrap --self

      - name: Self-install assets manifest
        run: PYTHONPATH=sdk:runtime python3 -m cursor_loop install . --force

      - name: Run pytest
        run: PYTHONPATH=sdk:runtime pytest -q

      - name: Run framework verify
        run: PYTHONPATH=sdk:runtime python3 -m cursor_loop verify --path .

      - name: Run doctor
        run: PYTHONPATH=sdk:runtime python3 -m cursor_loop doctor --path .
