name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]
        exclude:
          # Keep matrix lean on Windows
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest

      - name: Bootstrap and self-install
        shell: bash
        run: |
          export PYTHONPATH=sdk:runtime:install
          python -m cursor_loop bootstrap --self
          python -m cursor_loop install . --force

      - name: Pytest
        shell: bash
        run: PYTHONPATH=sdk:runtime:install pytest -q

      - name: Verify
        shell: bash
        run: PYTHONPATH=sdk:runtime:install python -m cursor_loop verify --path .

      - name: Doctor
        shell: bash
        run: PYTHONPATH=sdk:runtime:install python -m cursor_loop doctor --path .
