name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build assets without creating a GitHub Release"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest

      - name: Test and verify
        run: |
          export PYTHONPATH=sdk:runtime:install
          python -m cursor_loop bootstrap --self
          python -m cursor_loop install . --force
          pytest -q
          python -m cursor_loop verify --path .

      - name: Export release package
        id: export
        run: |
          export PYTHONPATH=sdk:runtime:install
          python -m cursor_loop export --output dist | tee export.json
          echo "archive=$(python -c 'import json; print(json.load(open(\"export.json\"))[\"archive\"])')" >> "$GITHUB_OUTPUT"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        run: |
          {
            echo "## Cursor Loop Engineering v$(cat VERSION)"
            echo
            echo "Reusable installation framework for any Cursor project."
            echo
            echo "### Install from this release"
            echo
            echo '```bash'
            echo "curl -L -o cle.tar.gz <asset-url>"
            echo "python -m cursor_loop import cle.tar.gz --target /path/to/project"
            echo '```'
            echo
            echo "### Verify"
            echo
            echo '```bash'
            echo "python -m cursor_loop verify --path /path/to/project"
            echo '```'
            if [ -f CHANGELOG.md ]; then
              echo
              echo "### Changelog"
              echo
              sed -n '1,80p' CHANGELOG.md
            fi
          } > RELEASE_NOTES.md

      - name: Upload assets (dry run / artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: cle-release-$(cat VERSION)
          path: |
            dist/*
            RELEASE_NOTES.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && github.event.inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.tar.gz
            dist/*.sha256
          draft: false
          generate_release_notes: true
